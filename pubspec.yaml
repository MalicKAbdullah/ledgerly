name: ledgerly
description: "Ledgerly - offline-first freelance invoice & client manager with encrypted storage and PDF export."
publish_to: 'none'

version: 1.6.1+10

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  fl_chart: ^1.2.0
  uuid: ^4.5.3
  intl: ^0.20.3
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  image: ^4.3.0
  share_plus: ^10.1.4
  file_picker: ^10.1.9
  core_crypto:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_crypto
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_storage:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_storage
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_theme:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_theme
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_ui:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_ui
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_backup:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_backup
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_lock:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_lock
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_notify:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_notify
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
  core_update:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_update
      ref: cbb18027fe47f685caff8d2252212d8042f1e45c
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#4A4FE0"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F6F7F9"
  color_dark: "#0A0C10"
  image: assets/brand/splash-tile.png
  branding: assets/brand/offlyne-endorsement.png
  branding_dark: assets/brand/offlyne-endorsement-white.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#4A4FE0"
    icon_background_color_dark: "#4A4FE0"
    color: "#F6F7F9"
    color_dark: "#0A0C10"
    branding: assets/brand/offlyne-endorsement.png
    branding_dark: assets/brand/offlyne-endorsement-white.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
